<script>
  (function() {
    const refreshBtn = document.getElementById('check-again-btn');
    const refreshIcon = document.getElementById('refresh-icon');
    const refreshLabel = document.getElementById('refresh-label');

    if (refreshBtn && refreshIcon && refreshLabel) {
      refreshBtn.addEventListener('click', function() {
        refreshIcon.classList.add('rotate-180');
        refreshLabel.textContent = 'Checking Nearby...';
        refreshBtn.disabled = true;
        refreshBtn.classList.add('opacity-80');

        setTimeout(function() {
          refreshIcon.classList.remove('rotate-180');
          refreshLabel.textContent = 'Still Up to Date!';
          
          setTimeout(function() {
            refreshLabel.textContent = 'Check Again';
            refreshBtn.disabled = false;
            refreshBtn.classList.remove('opacity-80');
          }, 1600);
        }, 800);
      });
    }
  })();
